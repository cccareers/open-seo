name: Sync upstream

# Opens (or refreshes) a pull request that merges every-app/open-seo main into
# this fork's main. Production on Coolify deploys manually, so merging the PR
# does not by itself change seo.getme.biz.
on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: github.repository == 'cccareers/open-seo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Merge upstream into a sync branch
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/every-app/open-seo.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -B sync/upstream
          if ! git merge --no-edit upstream/main; then
            git merge --abort
            echo "::error::Upstream does not merge cleanly. Run 'git merge upstream/main' locally and resolve the conflicts."
            exit 1
          fi
          git push --force origin sync/upstream
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="Merges every-app/open-seo main cleanly. Review, merge, then deploy production manually in Coolify."
          if gh pr view sync/upstream --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit sync/upstream --body "$body"
          else
            gh pr create --base main --head sync/upstream --title "Sync upstream every-app/open-seo" --body "$body"
          fi
